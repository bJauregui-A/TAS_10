services:
  haproxy:
    image: haproxy:2.8-alpine
    container_name: edge_haproxy
    restart: unless-stopped
    network_mode: host
    user: root
    cap_add:
      - NET_BIND_SERVICE
      - SYS_CHROOT
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./haproxy/certs:/etc/haproxy/certs:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  bind9:
    image: ubuntu/bind9:9.18-22.04_beta
    container_name: edge_dns
    restart: unless-stopped
    network_mode: host
    environment:
      - BIND9_USER=bind
    volumes:
      - ./bind9/named.conf:/etc/bind/named.conf:ro
      - ./bind9/named.conf.options:/etc/bind/named.conf.options:ro
      - ./bind9/named.conf.local:/etc/bind/named.conf.local:ro
      - ./bind9/zones:/etc/bind/zones:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
