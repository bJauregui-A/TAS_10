global
    log stdout format raw local0 info
    chroot /var/lib/haproxy
    stats socket /tmp/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    user haproxy
    group haproxy
    daemon
    ca-base /etc/ssl/certs
    crt-base /etc/haproxy/certs

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  30s
    timeout server  30s

# Redirige todo el trafico HTTP a HTTPS
frontend http_in
    bind *:80
    http-request redirect scheme https code 301 unless { ssl_fc }

# Entrada publica HTTPS con terminacion TLS
frontend https_in
    bind *:443 ssl crt /etc/haproxy/certs/nodosur10.pem
    mode http
    option forwardfor
    http-request set-header X-Forwarded-Proto https
    default_backend cms_backend

# Balanceo hacia los 2 CMS en la red privada
backend cms_backend
    mode http
    balance roundrobin
    option httpchk GET /wp-login.php
    http-check send hdr Host cms.tas10.local hdr X-Forwarded-Proto https
    http-check expect status 200
    cookie SRV insert indirect nocache
    server cms1 10.33.199.83:80 check cookie cms1
    server cms2 10.33.199.86:80 check cookie cms2

# Panel de estadisticas (puerto 8404)
listen stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 15s
    stats admin if TRUE
