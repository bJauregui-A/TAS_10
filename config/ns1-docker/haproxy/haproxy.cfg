global
    log stdout format raw local0 info
    chroot /var/lib/haproxy
    stats socket /tmp/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    user haproxy
    group haproxy
    daemon
    ca-base /etc/ssl/certs
    crt-base /etc/haproxy/certs

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    timeout check   10s

# Redirige todo el trafico HTTP a HTTPS
frontend http_in
    bind *:80
    http-request redirect scheme https code 301 unless { ssl_fc }

# Entrada publica HTTPS con terminacion TLS
frontend https_in
    bind *:443 ssl crt /etc/haproxy/certs/nodosur10.pem
    mode http
    option forwardfor
    http-request set-header X-Forwarded-Proto https

    # --- Mitigacion DoS & Rate Limiting por IP (Stick-Table) ---
    # Almacena hasta 100k IPs en memoria, expira tras 2 minutos sin peticiones.
    # Registra la tasa de peticiones en ventanas deslizantes de 10 segundos.
    stick-table type ip size 100k expire 2m store http_req_rate(10s)

    # Excluir de limitacion a localhost y la red interna de administracion
    acl whitelist_ips src 127.0.0.1 10.33.199.0/24

    # Rastrear tasa de peticiones por IP de origen (salvo lista blanca)
    http-request track-sc0 src unless whitelist_ips

    # Bloquear si la IP supera 120 peticiones en 10 segundos (>12 req/s continuos)
    # Retorna HTTP 429 Too Many Requests de forma inmediata en el borde perimetral
    acl req_rate_abuse sc_http_req_rate(0) gt 120
    http-request deny deny_status 429 hdr Retry-After 30 if req_rate_abuse !whitelist_ips

    default_backend cms_backend

# Balanceo hacia los 2 CMS en la red privada
backend cms_backend
    mode http
    balance roundrobin
    option httpchk GET /wp-login.php
    http-check send hdr Host cms.tas10.local hdr X-Forwarded-Proto https
    http-check expect status 200
    cookie SRV insert indirect nocache
    server cms1 10.33.199.83:80 check inter 5s cookie cms1
    server cms2 10.33.199.86:80 check inter 5s cookie cms2

# Panel de estadisticas (puerto 8404)
listen stats
    bind *:8404
    stats enable
    stats uri /
    http-request use-service prometheus-exporter if { path /metrics }
    stats refresh 15s
    stats admin if TRUE
