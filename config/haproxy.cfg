# Configuración de HAProxy (Borde del proyecto)
# Ruta en el servidor: /etc/haproxy/haproxy.cfg

global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    user haproxy
    group haproxy
    daemon
    ca-base /etc/ssl/certs
    crt-base /etc/haproxy/certs

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 408 /etc/haproxy/errors/408.http
    errorfile 500 /etc/haproxy/errors/500.http
    errorfile 502 /etc/haproxy/errors/502.http
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/504.http

# Redirige todo el tráfico HTTP al puerto HTTPS
frontend http_in
    bind *:80
    http-request redirect scheme https code 301 unless { ssl_fc }

# Entrada pública HTTPS con terminación TLS
frontend https_in
    bind *:443 ssl crt /etc/haproxy/certs/nodosur10.pem
    mode http
    option forwardfor
    http-request set-header X-Forwarded-Proto https
    default_backend cms_backend

# Balanceo de carga hacia los dos CMS en la red privada
backend cms_backend
    mode http
    balance roundrobin
    option httpchk GET /wp-login.php
    http-check send hdr Host cms.tas10.local hdr X-Forwarded-Proto https
    http-check expect status 200
    cookie SRV insert indirect nocache
    server cms1 10.33.199.83:80 check cookie cms1
    server cms2 10.33.199.86:80 check cookie cms2

# Panel gráfico de estadísticas (puerto 8404)
listen stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 15s
    stats admin if TRUE
