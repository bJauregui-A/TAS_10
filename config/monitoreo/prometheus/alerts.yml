groups:
  - name: nodo_sur_disponibilidad
    rules:
      - alert: BackendCMSCaido
        expr: haproxy_server_status{proxy="cms_backend", state="UP"} == 0
        for: 30s
        labels:
          severity: critical
          responsable: "Benjamin Reyes"
        annotations:
          summary: "Backend {{ $labels.server }} caido en HAProxy"
          description: "El nodo {{ $labels.server }} lleva mas de 30s fuera de servicio (DOWN) en cms_backend."

      - alert: SitioWebCaido
        expr: probe_success{job="blackbox_https"} == 0
        for: 30s
        labels:
          severity: critical
          responsable: "Marcelo Carrasco"
        annotations:
          summary: "Sitio web inaccesible ({{ $labels.instance }})"
          description: "La sonda HTTPS a {{ $labels.instance }} lleva mas de 30s fallando."

      - alert: MariaDBCaida
        expr: mysql_up == 0
        for: 30s
        labels:
          severity: critical
          responsable: "Benjamin Jauregui"
        annotations:
          summary: "Base de datos MariaDB (10.33.199.85:7033) caida"
          description: "mysqld_exporter no logra conectarse a MariaDB desde hace mas de 30s."

      - alert: HostCaido
        expr: up{job="hosts"} == 0
        for: 1m
        labels:
          severity: critical
          responsable: "Equipo Grupo 10"
        annotations:
          summary: "Host {{ $labels.nodo }} sin respuesta"
          description: "node_exporter en {{ $labels.nodo }} ({{ $labels.instance }}) no responde hace mas de 1 minuto."

  - name: nodo_sur_capacidad_rendimiento
    rules:
      - alert: LatenciaWebAlta
        expr: probe_duration_seconds{job="blackbox_https"} > 3
        for: 2m
        labels:
          severity: warning
          responsable: "Marcelo Carrasco"
        annotations:
          summary: "Latencia HTTPS elevada en {{ $labels.instance }}"
          description: "El tiempo de respuesta supera los 3 segundos (valor actual: {{ printf \"%.2f\" $value }}s)."

      - alert: DiscoAlto
        expr: (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"})) * 100 > 85
        for: 5m
        labels:
          severity: warning
          responsable: "Marcelo Carrasco"
        annotations:
          summary: "Uso de disco > 85% en {{ $labels.nodo }} ({{ $labels.mountpoint }})"
          description: "El volumen {{ $labels.mountpoint }} en {{ $labels.nodo }} tiene {{ printf \"%.1f\" $value }}% ocupado."

      - alert: MemoriaAlta
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          responsable: "Equipo Grupo 10"
        annotations:
          summary: "Uso de RAM > 85% en {{ $labels.nodo }}"
          description: "La memoria en {{ $labels.nodo }} supera el 85% (actual: {{ printf \"%.1f\" $value }}%)."
