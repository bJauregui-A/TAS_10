# Configuración real de DNS (ns1)

Esto es lo que tiene configurado el servidor DNS (BIND9) hoy. Está simplificado
para que se entienda fácil, no es el archivo completo.

```
acl "trusted" {
    10.30.248.0/24;    # VPN de la universidad
    10.33.195.128/25;  # red de acceso del proyecto
    10.33.199.0/29;    # red privada del proyecto
    10.33.21.0/24;     # laboratorio
    10.33.112.0/24;    # eduroam
};

options {
    recursion yes;
    allow-recursion { trusted; };   # solo estas redes pueden pedirle que busque otros dominios
    listen-on { 10.33.195.185; 10.33.199.82; };  # escucha en las dos IP de ns1
    allow-transfer { none; };       # nadie puede copiarse las zonas completas
    allow-query { trusted; };       # solo estas redes pueden hacerle consultas
    forwarders { 8.8.8.8; 8.8.4.4; };  # si no sabe algo, pregunta a Google DNS
};
```

**En palabras simples:** el servidor solo responde consultas a las redes de la
lista `trusted` (la universidad, el proyecto y el laboratorio). Nadie puede
copiarse las zonas completas (`allow-transfer none`), y si le preguntan por un
dominio que no conoce, lo reenvía a Google DNS.
