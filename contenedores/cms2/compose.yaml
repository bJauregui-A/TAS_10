services:
  wordpress:
    image: wordpress:php8.3-apache
    container_name: nodo_cms2
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
    environment:
      WORDPRESS_DB_HOST: 10.33.199.85:7033
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_CONFIG_EXTRA: |
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
          $$_SERVER['HTTPS'] = 'on';
        }
    volumes:
      - /var/www/html:/var/www/html
      - /var/www/html/wp-content/uploads:/var/www/html/wp-content/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'Host: cms.tas10.local' -H 'X-Forwarded-Proto: https' http://127.0.0.1/wp-login.php >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
